name: E2E (Neon staging)

on:
  pull_request:
    branches: [dev]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend (e2e specs live there)
        uses: actions/checkout@v4
        with:
          repository: Warrior6789/horse_racing_react
          path: frontend

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Reset e2e fixture data
        working-directory: frontend
        env:
          E2E_DATABASE_URL: ${{ secrets.NEON_E2E_DATABASE_URL }}
        run: node e2e/reset-e2e-data.js

      - name: Run Playwright e2e tests
        working-directory: frontend
        env:
          VITE_API_URL: "https://horseracingproject-production.up.railway.app"
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
