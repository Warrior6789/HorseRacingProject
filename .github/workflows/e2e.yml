name: E2E (Neon staging)

on:
  pull_request:
    branches: [dev]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: Warrior6789/horse_racing_react
          path: frontend

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Pin SDK to the installed .NET 8
        working-directory: HorseRacingProject
        run: echo '{"sdk":{"version":"8.0.422","rollForward":"latestFeature"}}' > global.json

      - name: Debug - resolve TargetFramework
        working-directory: HorseRacingProject
        run: |
          dotnet --version
          dotnet msbuild HorseRacingAPI.csproj -getProperty:TargetFramework
          echo "---env---"
          env | grep -i "dotnet\|msbuild\|target" || true

      - name: Start backend against Neon e2e branch
        working-directory: HorseRacingProject
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.NEON_E2E_CONNECTION_STRING }}
          Jwt__Key: "e2e-ci-signing-key-never-used-in-production-0000"
          Jwt__Issuer: "HorseRacingAPI"
          Jwt__Audience: "HorseRacingFrontend"
          Jwt__DurationInMinutes: "180"
        run: |
          nohup dotnet run --framework net8.0 --urls http://localhost:5035 > ../backend.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5035/ || true)
            if [ "$code" != "000" ] && [ -n "$code" ]; then echo "Backend is up (HTTP $code)"; break; fi
            sleep 2
          done

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Reset e2e fixture data
        working-directory: frontend
        env:
          E2E_DATABASE_URL: ${{ secrets.NEON_E2E_DATABASE_URL }}
        run: node e2e/reset-e2e-data.js

      - name: Run Playwright e2e tests
        working-directory: frontend
        env:
          VITE_API_URL: ""
        run: npx playwright test

      - name: Show backend log on failure
        if: failure()
        run: cat backend.log

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
