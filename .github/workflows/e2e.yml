name: E2E (Neon staging)

on:
  pull_request:
    branches: [dev]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: Warrior6789/horse_racing_react
          path: frontend

      - name: Start backend against Neon e2e branch (via Docker, same image as production)
        working-directory: HorseRacingProject
        run: |
          docker run -d --name backend --network host \
            -v "$PWD:/src" -w /src \
            -e ConnectionStrings__DefaultConnection="${{ secrets.NEON_E2E_CONNECTION_STRING }}" \
            -e Jwt__Key="e2e-ci-signing-key-never-used-in-production-0000" \
            -e Jwt__Issuer="HorseRacingAPI" \
            -e Jwt__Audience="HorseRacingFrontend" \
            -e Jwt__DurationInMinutes="180" \
            mcr.microsoft.com/dotnet/sdk:8.0 \
            dotnet run --urls http://localhost:5035
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5035/ || true)
            if [ "$code" != "000" ] && [ -n "$code" ]; then echo "Backend is up (HTTP $code)"; break; fi
            sleep 2
          done
          {
            echo "=== DEBUG curl -v multipart ==="
            curl --version
            curl -v -s -o /dev/null -X POST http://localhost:5035/api/auth/register \
              -F "fullName=Debug User" \
              -F "email=debug-curl-$(date +%s)@test.com" \
              -F "phone=0900000000" \
              -F "password=Passw0rd!123" 2>&1
            echo "=== END DEBUG ==="
          } > ../debug-curl.log 2>&1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Reset e2e fixture data
        working-directory: frontend
        env:
          E2E_DATABASE_URL: ${{ secrets.NEON_E2E_DATABASE_URL }}
        run: node e2e/reset-e2e-data.js

      - name: Run Playwright e2e tests
        working-directory: frontend
        env:
          VITE_API_URL: ""
        run: npx playwright test

      - name: Show backend log on failure
        if: failure()
        run: |
          docker logs backend > backend.log 2>&1 || true
          cat backend.log debug-curl.log

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
