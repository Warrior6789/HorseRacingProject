name: E2E (Neon staging)

on:
  pull_request:
    branches: [dev]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: Warrior6789/horse_racing_react
          path: frontend

      - name: Install isolated .NET 8 SDK
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --channel 8.0 --install-dir "$HOME/dotnet8"
          echo "$HOME/dotnet8" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/dotnet8" >> "$GITHUB_ENV"

      - name: Start backend against Neon e2e branch
        working-directory: HorseRacingProject
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.NEON_E2E_CONNECTION_STRING }}
          Jwt__Key: "e2e-ci-signing-key-never-used-in-production-0000"
          Jwt__Issuer: "HorseRacingAPI"
          Jwt__Audience: "HorseRacingFrontend"
          Jwt__DurationInMinutes: "180"
        run: |
          {
            echo "=== DEBUG dotnet resolution ==="
            which dotnet
            dotnet --version
            dotnet msbuild HorseRacingAPI.csproj -getProperty:TargetFramework
            echo "=== END DEBUG dotnet resolution ==="
          } > ../debug-curl.log 2>&1
          dotnet build HorseRacingAPI.csproj -v:diag > /tmp/msbuild-diag.log 2>&1 || true
          {
            echo "=== DEBUG msbuild diag (TargetFramework reassignments) ==="
            grep -n "TargetFramework" /tmp/msbuild-diag.log | grep -i "reassign\|=.*net10\|Overriding" | head -60
            echo "=== END DEBUG msbuild diag ==="
          } >> ../debug-curl.log 2>&1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Reset e2e fixture data
        working-directory: frontend
        env:
          E2E_DATABASE_URL: ${{ secrets.NEON_E2E_DATABASE_URL }}
        run: node e2e/reset-e2e-data.js

      - name: Run Playwright e2e tests
        working-directory: frontend
        env:
          VITE_API_URL: ""
        run: npx playwright test

      - name: Show backend log on failure
        if: failure()
        run: cat backend.log debug-curl.log

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
