name: Generate PlantUML Diagrams

on:
  push:
    branches:
      - Long

jobs:
  render_diagrams:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: Long
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install PlantUML dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y graphviz default-jre-headless
          wget -q https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar -O /tmp/plantuml.jar

      - name: Render PlantUML diagrams
        run: |
          mkdir -p HorseRacingProject/Docs/png
          find HorseRacingProject/Docs/puml -name "*.puml" -exec \
            java -jar /tmp/plantuml.jar -v -tpng -o "$(pwd)/HorseRacingProject/Docs/png" {} \;

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add HorseRacingProject/Docs/png/*.png 2>/dev/null || true

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Bot: Automatically updated architecture diagrams [skip ci]"
            git push origin Long
          else
            echo "No changes to commit"
          fi
