name: Generate PlantUML Diagrams

on:
  push:
    branches:
      - dev

jobs:
  render_diagrams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Render PlantUML
        uses: gruberma/plantuml-action-docker@v1
        with:
          args: -v -tpng "HorseRacingProject/HorseRacingAPI/Docs/*.puml"

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add "HorseRacingProject/HorseRacingAPI/Docs/*.png" || true
          
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Bot: Automatically updated architecture diagrams [skip ci]"
            git push origin dev
          else
            echo "No changes to commit"
          fi